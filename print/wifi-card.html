<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guest Wifi</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Public+Sans:wght@400;600&display=swap">
<style>
  @page { size: 5in 7in; margin: 0; }

  :root {
    --ink:    #15171F;
    --muted:  #6C6A62;
    --accent: #D9931A;
    --line:   #D6D3CA;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    width: 5in;
    height: 7in;
    background: #FFFFFF;
    color: var(--ink);
    font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .card {
    width: 5in;
    height: 7in;
    padding: 0.4in 0.45in 0.35in;   /* safe area inside the 5x7 trim */
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* --- signature line --- */
  .card > * { flex: none; }

  .sig {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 8.5pt;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .rule {
    width: 100%;
    height: 6px;
    background: var(--accent);
  }

  /* --- headline --- */
  h1 {
    font-family: Anton, "Arial Narrow", Impact, sans-serif;
    font-weight: 400;
    font-size: 40pt;
    line-height: 0.96;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0.28in 0 0;
  }

  .sub {
    font-size: 10pt;
    line-height: 1.4;
    color: var(--muted);
    margin: 0.11in 0 0;
  }

  /* --- QR --- */
  .qr {
    width: 2.15in;
    height: 2.15in;
    margin-top: 0.24in;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr svg { width: 100%; height: 100%; display: block; }

  /* --- network --- */
  .network { margin-top: 0.2in; }
  .network .label {
    font-family: "Public Sans", sans-serif;
    font-size: 7.5pt;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .network .ssid {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 15pt;
    font-weight: 700;
    margin-top: 0.05in;
  }

  .network .link {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 9pt;
    color: var(--muted);
    margin-top: 0.07in;
  }

  /* --- footer: the three seats --- */
  .foot {
    margin-top: auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.09in;
  }
  .foot .divider {
    width: 1.1in;
    height: 1px;
    background: var(--line);
  }
  .qr2 { width: 0.92in; height: 0.92in; }
  .qr2 svg { width: 100%; height: 100%; display: block; }
  .foot .then {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 7.5pt;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>

    <h1>Guest<br>Wifi</h1>
    <p class="sub">Scan the code to get on the wifi.</p>

    <div class="qr" id="qr"></div>

    <div class="network">
      <div class="label">Network</div>
      <div class="ssid">Plastic Labs-Guest</div>
    </div>

    <div class="foot">
      <div class="divider"></div>
      <div class="qr2" id="qr2"></div>
      <div class="then">Then scan this one</div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  var WIFI = {
    ssid: "Plastic Labs-Guest",
    password: "Carwash-Shriek-Petite-Underarm-Renewable",
    security: "WPA"
  };
  function esc(s) { return String(s).replace(/([\\;,:"])/g, "\\$1"); }
  var payload = "WIFI:T:" + WIFI.security + ";S:" + esc(WIFI.ssid) + ";P:" + esc(WIFI.password) + ";;";
  // Q (25% recovery) keeps the dense wifi payload from needing a huge code.
  var qr = qrcode(0, "Q");
  qr.addData(payload);
  qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });

  // The short URL stays sparse even at level H, so it survives being small.
  var qr2 = qrcode(0, "H");
  qr2.addData("http://backrowboys.fun");
  qr2.make();
  document.getElementById("qr2").innerHTML = qr2.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
</script>
</body>
</html>
